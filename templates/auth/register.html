{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="form-card">
    <div class="form-header-logo" style="text-align: center; margin-bottom: 0.2rem;">
        <img src="{% static 'img/logo.png' %}" alt="TeamProject Logo" style="width: 100px; height: 100px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(79, 70, 229, 0.28));">
    </div>
    <h2 class="form-title" style="text-align: center;">Crear Cuenta</h2>
    <p class="form-subtitle" style="text-align: center;">Regístrate para comenzar</p>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: #d93838; display: block; margin-top: 0.35rem; font-weight: 600;">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Registrarme</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted);">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Inicia sesión</a>
    </p>
</div>
{% endblock %}
