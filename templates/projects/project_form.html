{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2 class="form-title">{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <small style="color: #ff8b8b; display: block; margin-top: 0.35rem; font-weight: 600;">{{ field.errors.0 }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar Proyecto</button>
            {% if project %}
                <a href="{% url 'project_detail' project.id %}" class="btn btn-cancel">Cancelar</a>
            {% else %}
                <a href="{% url 'project_list' %}" class="btn btn-cancel">Cancelar</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
